name: Trigger Pages after admin restart token fix

on:
  push:
    paths:
      - .github/workflows/trigger-pages-admin-restart-token.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove temporary trigger workflow
        run: |
          rm -f .github/workflows/trigger-pages-admin-restart-token.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trigger-pages-admin-restart-token.yml
          git commit -m "Remove temporary admin restart pages trigger"
          git push origin main
