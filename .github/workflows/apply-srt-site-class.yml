name: Apply SRT Site Class Fix

on:
  push:
    paths:
      - .github/workflows/apply-srt-site-class.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WoodWise SRT site classes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workflowPath = '.github/workflows/apply-srt-site-class.yml';
          const csvPath = 'samples/woodwise-all-strata-52374-acres.csv';
          let text = fs.readFileSync(csvPath, 'utf8');

          function parseCSV(text) {
            const rows = [];
            let row = [];
            let field = '';
            let quoted = false;
            for (let i = 0; i < text.length; i += 1) {
              const char = text[i];
              const next = text[i + 1];
              if (quoted) {
                if (char === '"' && next === '"') {
                  field += '"';
                  i += 1;
                } else if (char === '"') {
                  quoted = false;
                } else {
                  field += char;
                }
              } else if (char === '"') {
                quoted = true;
              } else if (char === ',') {
                row.push(field);
                field = '';
              } else if (char === '\n') {
                row.push(field.replace(/\r$/, ''));
                rows.push(row);
                row = [];
                field = '';
              } else {
                field += char;
              }
            }
            if (field || row.length) {
              row.push(field);
              rows.push(row);
            }
            return rows;
          }

          function csvEscape(value) {
            const text = String(value ?? '');
            return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          }

          function propertyName(name) {
            return name.split(String.fromCharCode(8212)).map((part) => part.trim())[1] || '';
          }

          const rows = parseCSV(text);
          const header = rows[0];
          const index = Object.fromEntries(header.map((name, i) => [name, i]));
          const srtProperties = new Set(['Worth', 'Little Jon North', 'Little Jon South', 'Redfield', 'Williamstown', 'WoodWise Timberlands']);
          const hardwoodTypes = new Set(['saf-24', 'saf-25', 'saf-27', 'saf-28', 'saf-30', 'saf-31', 'saf-60', 'saf-108']);

          for (const row of rows.slice(1)) {
            const isSrt = srtProperties.has(propertyName(row[index.stratumOrStand]));
            const isHardwood = hardwoodTypes.has(row[index.forestCoverTypeId]);
            if (isSrt && isHardwood) {
              row[index.siteClass] = '1';
              if (row[index.notes]) {
                row[index.notes] = row[index.notes].replace(/Site class 2/g, 'Site class 1');
                row[index.notes] = row[index.notes].replace(/site class 2/g, 'site class 1');
              }
            }
          }

          fs.writeFileSync(csvPath, rows.map((row) => row.map(csvEscape).join(',')).join('\n') + '\n');

          const testPath = 'src/tests/forestry.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          if (!test.includes('woodwise-all-strata-52374-acres.csv?raw')) {
            test = test.replace(
              'import { describe, expect, it } from "vitest";\n',
              'import { describe, expect, it } from "vitest";\nimport allWoodWiseStrataCsv from "../../samples/woodwise-all-strata-52374-acres.csv?raw";\n'
            );
          }
          if (!test.includes('loads WoodWise strata with site 1 covering at least half the acreage')) {
            test = test.replace(
              '\n});\n',
              '\n\n  it("loads WoodWise strata with site 1 covering at least half the acreage", () => {\n    const imported = csvToStrata(allWoodWiseStrataCsv);\n    const totalAcres = imported.reduce((sum, stratum) => sum + stratum.acres, 0);\n    const siteOneAcres = imported\n      .filter((stratum) => stratum.siteClass === "1")\n      .reduce((sum, stratum) => sum + stratum.acres, 0);\n\n    expect(totalAcres).toBe(52374);\n    expect(siteOneAcres).toBeGreaterThan(totalAcres / 2);\n  });\n});\n'
            );
          }
          fs.writeFileSync(testPath, test);
          if (fs.existsSync(workflowPath)) fs.rmSync(workflowPath);
          NODE
      - name: Build check
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/woodwise-all-strata-52374-acres.csv src/tests/forestry.test.ts .github/workflows/apply-srt-site-class.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Set SRT WoodWise hardwood strata to site 1"
            git push
          fi
