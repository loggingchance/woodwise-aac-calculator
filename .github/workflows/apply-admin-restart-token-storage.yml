name: Apply admin restart token storage fix

on:
  push:
    paths:
      - .github/workflows/apply-admin-restart-token-storage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch restart token storage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          text = path.read_text()
          text = text.replace('let adminToken = sessionStorage.getItem("woodwise-aac-admin-token") || "";', 'let adminToken = localStorage.getItem(adminRestartTokenStorageKey) || "";')
          text = text.replace('adminToken = window.prompt("Admin restart token")?.trim() || "";', 'adminToken = window.prompt("Admin restart token - paste it once on this computer")?.trim() || "";')
          text = text.replace('sessionStorage.setItem("woodwise-aac-admin-token", adminToken);', 'localStorage.setItem(adminRestartTokenStorageKey, adminToken);')
          text = text.replace('if (response.status === 401) sessionStorage.removeItem("woodwise-aac-admin-token");', 'if (response.status === 401) localStorage.removeItem(adminRestartTokenStorageKey);')
          needle = 'const frontPinHash = import.meta.env.VITE_AAC_FRONT_PIN_HASH || defaultFrontPinHash;\n'
          replacement = needle + 'const adminRestartTokenStorageKey = "woodwise-aac-admin-restart-token";\n'
          if 'const adminRestartTokenStorageKey = "woodwise-aac-admin-restart-token";' not in text:
              text = text.replace(needle, replacement)
          path.write_text(text)
          Path('.github/workflows/apply-admin-restart-token-storage.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx .github/workflows/apply-admin-restart-token-storage.yml
          git commit -m "Remember WoodWise admin restart token"
          git push origin main
