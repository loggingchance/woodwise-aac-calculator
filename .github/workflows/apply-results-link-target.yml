name: Apply Results Link Target

on:
  push:
    paths:
      - .github/workflows/apply-results-link-target.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch results link target
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workflowPath = '.github/workflows/apply-results-link-target.yml';
          let main = fs.readFileSync('src/main.tsx', 'utf8');
          main = main.replace('href="#fvs-results">View FVS results</a>', 'href="#aac-report">View FVS results</a>');
          main = main.replace('<section className="report-section">', '<section className="report-section" id="aac-report">');
          fs.writeFileSync('src/main.tsx', main);
          if (fs.existsSync(workflowPath)) fs.rmSync(workflowPath);
          NODE
      - name: Build check
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx .github/workflows/apply-results-link-target.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Point results link to AAC report"
            git push
          fi
